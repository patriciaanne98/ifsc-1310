<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Images Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #efefef;
      color: #222;
      margin: 0;
      padding: 30px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    h1 {
      margin-top: 0;
    }

    img {
      width: 100%;
      max-width: 800px;
      display: block;
      margin: 20px auto;
    }

    .note {
      background: #f5f5f5;
      padding: 15px;
      border-left: 5px solid #6f2cff;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Responsive Images Demo</h1>

    <p>
      This demo uses <code>srcset</code> to load different image sizes depending on the screen width.
      The image is from my Clario AI budgeting project.
    </p>

    <img
  src="img/money-calculator_medium.jpg"
  srcset="
    img/money-calculator_small.jpg 400w,
    img/money-calculator_medium.jpg 800w,
    img/money-calculator_large.jpg 1200w
  "
  sizes="(max-width: 600px) 100vw,
         (max-width: 1000px) 80vw,
         800px"
  alt="Calculator and budgeting materials for Clario AI project"
>

    <div class="note">
      <p>
        The browser can choose the small, medium, or large version before downloading the image.
        This helps improve performance on smaller screens.
      </p>
    </div>
  </main>
</body>
</html>
